{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=", initial-scale="1.0">
    <link rel="stylesheet" href="{% static 'vulnerability/CSS/reset-password.css' %}" />
</head>
<body>
    <div class="wrapper">
    <h1>Forgot Password</h1>
    <p class="subtext">Enter a New Password for Your Account</p>
 
    <form method="POST">
      {% csrf_token %}
 
      <div class="input-box">
        <label>New Password</label>
        <input type="password" name="new_password" placeholder="Enter Password" required>
        <input type="password" name="new_password" placeholder="Conform Password" required>
      </div>
 
      <button type="submit" class="btn">Sumbit</button>
    </form>
 
    <div class="register-link">
      <p>Remember your password? <a href="{% url 'login' %}">Back to login</a></p>
    </div>
  </div>
  
</body>
</html>
