{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=", initial-scale="1.0">
    <link rel="stylesheet" href="{% static 'vulnerability/CSS/forgot-password.css' %}" />
</head>
<body>
    <div class="wrapper">
    <h1>Forgot Password</h1>
    <p class="subtext">Enter the email address associated with your account.</p>
 
    <form method="POST">
      {% csrf_token %}
 
      <div class="input-box">
        <label>Email</label>
        <input type="email" name="email" placeholder="Enter Your Email" required>
      </div>
 
      <button type="submit" class="btn">Send the link</button>
    </form>
 
    <div class="register-link">
      <p>Remember your password? <a href="{% url 'login' %}">Back to login</a></p>
    </div>
  </div>

</body>
</html>
